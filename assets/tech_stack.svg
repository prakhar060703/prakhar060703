<svg width="680" height="230" viewBox="0 0 680 230" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tech stack system graph animation</title>
<desc>Split view: left shows a terminal booting a Django/GraphQL server, right shows a live system graph of backend components</desc>
<defs>
  <style>
    @keyframes rowFade { 0%{opacity:0;transform:translateX(-6px)} 100%{opacity:1;transform:translateX(0)} }
    @keyframes connLine { 0%{stroke-dashoffset:120} 100%{stroke-dashoffset:0} }
    @keyframes nodePop { 0%{opacity:0} 60%{opacity:1} 100%{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
    .r1{animation:rowFade 0.35s ease both 0.1s}
    .r2{animation:rowFade 0.35s ease both 0.3s}
    .r3{animation:rowFade 0.35s ease both 0.5s}
    .r4{animation:rowFade 0.35s ease both 0.7s}
    .r5{animation:rowFade 0.35s ease both 0.9s}
    .r6{animation:rowFade 0.35s ease both 1.1s}
    .r7{animation:rowFade 0.35s ease both 1.3s}
    .r8{animation:rowFade 0.35s ease both 1.5s}
    .r9{animation:rowFade 0.35s ease both 1.7s}
    .r10{animation:rowFade 0.35s ease both 1.9s}
    .cl1{stroke-dasharray:120;stroke-dashoffset:120;animation:connLine 0.8s ease both 0.5s}
    .cl2{stroke-dasharray:120;stroke-dashoffset:120;animation:connLine 0.8s ease both 0.8s}
    .cl3{stroke-dasharray:120;stroke-dashoffset:120;animation:connLine 0.8s ease both 1.1s}
    .cl4{stroke-dasharray:120;stroke-dashoffset:120;animation:connLine 0.8s ease both 1.4s}
    .cl5{stroke-dasharray:120;stroke-dashoffset:120;animation:connLine 0.8s ease both 1.7s}
    .cl6{stroke-dasharray:120;stroke-dashoffset:120;animation:connLine 0.8s ease both 2.0s}
    .np1{animation:nodePop 0.4s ease both 0.4s}
    .np2{animation:nodePop 0.4s ease both 0.7s}
    .np3{animation:nodePop 0.4s ease both 1.0s}
    .np4{animation:nodePop 0.4s ease both 1.3s}
    .np5{animation:nodePop 0.4s ease both 1.6s}
    .np6{animation:nodePop 0.4s ease both 1.9s}
    .np7{animation:nodePop 0.4s ease both 2.2s}
    .p1{animation:pulse 2s ease-in-out infinite}
  </style>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="230" fill="#0d1117" rx="12"/>

<rect x="20" y="16" width="300" height="200" rx="6" fill="#0a0e13" stroke="#2C2C2A" stroke-width="1"/>
<rect x="20" y="16" width="300" height="24" rx="6" fill="#1a1f26" stroke="#2C2C2A" stroke-width="1"/>
<rect x="20" y="28" width="300" height="12" fill="#1a1f26"/>
<circle cx="36" cy="28" r="5" fill="#A32D2D"/>
<circle cx="52" cy="28" r="5" fill="#854F0B"/>
<circle cx="68" cy="28" r="5" fill="#3B6D11"/>
<text x="168" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#888780">prakhar@iit-kgp ~ bash</text>

<text x="32" y="58" font-family="monospace" font-size="10" fill="#639922" class="r1">$ python manage.py runserver</text>
<text x="32" y="72" font-family="monospace" font-size="10" fill="#888780" class="r2">  Watching for file changes...</text>
<text x="32" y="86" font-family="monospace" font-size="10" fill="#378ADD" class="r3">  Starting development server</text>
<text x="32" y="100" font-family="monospace" font-size="10" fill="#888780" class="r4">  <tspan fill="#1d9e75">✓</tspan> PostgreSQL connected</text>
<text x="32" y="114" font-family="monospace" font-size="10" fill="#888780" class="r5">  <tspan fill="#1d9e75">✓</tspan> Redis cache ready</text>
<text x="32" y="128" font-family="monospace" font-size="10" fill="#888780" class="r6">  <tspan fill="#1d9e75">✓</tspan> Neo4j graph online</text>
<text x="32" y="142" font-family="monospace" font-size="10" fill="#888780" class="r7">  <tspan fill="#1d9e75">✓</tspan> Kafka consumer active</text>
<text x="32" y="156" font-family="monospace" font-size="10" fill="#888780" class="r8">  <tspan fill="#EF9F27">▸</tspan> GraphQL schema loaded</text>
<text x="32" y="170" font-family="monospace" font-size="10" fill="#888780" class="r9">  <tspan fill="#EF9F27">▸</tspan> JWT auth middleware set</text>
<text x="32" y="186" font-family="monospace" font-size="10" fill="#1d9e75" class="r10">$ █</text>

<rect x="346" y="16" width="314" height="200" rx="6" fill="#0a0e13" stroke="#2C2C2A" stroke-width="1"/>
<text x="503" y="36" text-anchor="middle" font-family="monospace" font-size="9" fill="#444441" letter-spacing="1">SYSTEM GRAPH</text>

<circle cx="503" cy="104" r="24" fill="#0a1a12" stroke="#1d9e75" stroke-width="1.5" class="np1 p1"/>
<text x="503" y="101" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d9e75" class="np1">Django</text>
<text x="503" y="113" text-anchor="middle" font-family="monospace" font-size="7" fill="#0f6e56" class="np1">GraphQL</text>

<line x1="480" y1="86" x2="440" y2="60" stroke="#378ADD" stroke-width="1" marker-end="url(#a2)" class="cl1"/>
<circle cx="422" cy="52" r="18" fill="#042C53" stroke="#378ADD" stroke-width="1" class="np2"/>
<text x="422" y="49" text-anchor="middle" font-family="monospace" font-size="8" fill="#378ADD" class="np2">Postgres</text>
<text x="422" y="60" text-anchor="middle" font-family="monospace" font-size="7" fill="#185FA5" class="np2">ORM</text>

<line x1="479" y1="96" x2="437" y2="104" stroke="#E24B4A" stroke-width="1" marker-end="url(#a2)" class="cl2"/>
<circle cx="418" cy="104" r="18" fill="#1a0505" stroke="#E24B4A" stroke-width="1" class="np3"/>
<text x="418" y="101" text-anchor="middle" font-family="monospace" font-size="8" fill="#E24B4A" class="np3">Redis</text>
<text x="418" y="112" text-anchor="middle" font-family="monospace" font-size="7" fill="#A32D2D" class="np3">cache</text>

<line x1="480" y1="120" x2="440" y2="150" stroke="#008CC1" stroke-width="1" marker-end="url(#a2)" class="cl3"/>
<circle cx="420" cy="158" r="18" fill="#04212e" stroke="#008CC1" stroke-width="1" class="np4"/>
<text x="420" y="155" text-anchor="middle" font-family="monospace" font-size="8" fill="#008CC1" class="np4">Neo4j</text>
<text x="420" y="166" text-anchor="middle" font-family="monospace" font-size="7" fill="#0c5575" class="np4">Cypher</text>

<line x1="527" y1="86" x2="562" y2="60" stroke="#EF9F27" stroke-width="1" marker-end="url(#a2)" class="cl4"/>
<circle cx="580" cy="52" r="18" fill="#1a1000" stroke="#EF9F27" stroke-width="1" class="np5"/>
<text x="580" y="49" text-anchor="middle" font-family="monospace" font-size="8" fill="#EF9F27" class="np5">Kafka</text>
<text x="580" y="60" text-anchor="middle" font-family="monospace" font-size="7" fill="#854F0B" class="np5">events</text>

<line x1="527" y1="104" x2="568" y2="104" stroke="#7F77DD" stroke-width="1" marker-end="url(#a2)" class="cl5"/>
<circle cx="586" cy="104" r="18" fill="#100f1e" stroke="#7F77DD" stroke-width="1" class="np6"/>
<text x="586" y="101" text-anchor="middle" font-family="monospace" font-size="8" fill="#7F77DD" class="np6">MinIO</text>
<text x="586" y="112" text-anchor="middle" font-family="monospace" font-size="7" fill="#534AB7" class="np6">media</text>

<line x1="527" y1="120" x2="562" y2="148" stroke="#5DCAA5" stroke-width="1" marker-end="url(#a2)" class="cl6"/>
<circle cx="580" cy="158" r="18" fill="#031a11" stroke="#5DCAA5" stroke-width="1" class="np7"/>
<text x="580" y="155" text-anchor="middle" font-family="monospace" font-size="8" fill="#5DCAA5" class="np7">Celery</text>
<text x="580" y="166" text-anchor="middle" font-family="monospace" font-size="7" fill="#1D9E75" class="np7">workers</text>

<text x="503" y="198" text-anchor="middle" font-family="monospace" font-size="8" fill="#2C2C2A">JWT · rate-limit · versioning · validation</text>
</svg>
