<svg width="680" height="220" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Computer vision egocentric memory pipeline</title>
<desc>Animated diagram showing an egocentric camera feeding frames into a memory store, which retrieves evidence to answer a query via an LLM</desc>
<defs>
  <style>
    @keyframes flowDash { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }
    @keyframes memDot { 0%,100%{r:3;opacity:0.3} 50%{r:5;opacity:1} }
    @keyframes bar1 { 0%,100%{width:44px} 50%{width:52px} }
    @keyframes fadeSlide { 0%{opacity:0;transform:translateX(-6px)} 100%{opacity:1;transform:translateX(0)} }
    .flow1{stroke-dasharray:8 4;stroke-dashoffset:200;animation:flowDash 2s linear infinite}
    .flow2{stroke-dasharray:8 4;stroke-dashoffset:200;animation:flowDash 2s linear infinite 0.5s}
    .flow3{stroke-dasharray:8 4;stroke-dashoffset:200;animation:flowDash 2s linear infinite 1s}
    .flow4{stroke-dasharray:8 4;stroke-dashoffset:200;animation:flowDash 2s linear infinite 1.5s}
    .p1{animation:pulse 2s ease-in-out infinite}
    .p2{animation:pulse 2s ease-in-out infinite 0.5s}
    .p3{animation:pulse 2s ease-in-out infinite 1s}
    .p4{animation:pulse 2s ease-in-out infinite 1.5s}
    .md1{animation:memDot 2.5s ease-in-out infinite}
    .md2{animation:memDot 2.5s ease-in-out infinite 0.5s}
    .md3{animation:memDot 2.5s ease-in-out infinite 1s}
    .md4{animation:memDot 2.5s ease-in-out infinite 1.5s}
    .md5{animation:memDot 2.5s ease-in-out infinite 2s}
    .si1{animation:fadeSlide 0.5s ease both 0.1s}
    .si2{animation:fadeSlide 0.5s ease both 0.3s}
    .si3{animation:fadeSlide 0.5s ease both 0.6s}
    .si4{animation:fadeSlide 0.5s ease both 0.9s}
    .si5{animation:fadeSlide 0.5s ease both 1.2s}
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="220" fill="#0d1117" rx="12"/>

<text x="340" y="26" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d9e75" letter-spacing="3" class="si1">LONG-TERM MEMORY · EGOCENTRIC VIDEO PIPELINE</text>

<g class="si1">
  <rect x="30" y="46" width="78" height="80" rx="6" fill="#0a1a12" stroke="#1d9e75" stroke-width="1"/>
  <rect x="38" y="54" width="62" height="46" rx="3" fill="#061008" stroke="#1d9e75" stroke-width="0.5"/>
  <circle cx="69" cy="77" r="13" fill="none" stroke="#1d9e75" stroke-width="1" class="p1"/>
  <circle cx="69" cy="77" r="8" fill="#1d9e75" class="p2"/>
  <circle cx="69" cy="77" r="3" fill="#0d1117"/>
  <line x1="38" y1="108" x2="100" y2="108" stroke="#1d9e75" stroke-width="0.5" opacity="0.4"/>
  <text x="69" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d9e75">EGO-CAM</text>
  <text x="69" y="130" text-anchor="middle" font-family="monospace" font-size="8" fill="#0f6e56">first-person</text>
</g>

<line x1="108" y1="86" x2="148" y2="86" stroke="#1d9e75" stroke-width="1" marker-end="url(#arr)" class="flow1 si2"/>

<g class="si2">
  <rect x="150" y="46" width="86" height="80" rx="6" fill="#030d1a" stroke="#378ADD" stroke-width="1"/>
  <rect x="162" y="58" width="18" height="14" rx="2" fill="#0c447c" stroke="#378ADD" stroke-width="0.5" class="p1"/>
  <rect x="184" y="58" width="18" height="14" rx="2" fill="#0c447c" stroke="#378ADD" stroke-width="0.5" class="p2"/>
  <rect x="206" y="58" width="18" height="14" rx="2" fill="#0c447c" stroke="#378ADD" stroke-width="0.5" class="p3"/>
  <rect x="162" y="76" width="18" height="14" rx="2" fill="#185FA5" stroke="#378ADD" stroke-width="0.5" class="p4"/>
  <rect x="184" y="76" width="18" height="14" rx="2" fill="#0c447c" stroke="#378ADD" stroke-width="0.5" class="p1"/>
  <rect x="206" y="76" width="18" height="14" rx="2" fill="#185FA5" stroke="#378ADD" stroke-width="0.5" class="p2"/>
  <text x="193" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#378ADD">FRAMES</text>
  <text x="193" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#185FA5">EVA-CLIP</text>
</g>

<line x1="236" y1="86" x2="276" y2="86" stroke="#378ADD" stroke-width="1" marker-end="url(#arr)" class="flow2 si3"/>

<g class="si3">
  <rect x="278" y="34" width="104" height="104" rx="6" fill="#0c0917" stroke="#7F77DD" stroke-width="1"/>
  <text x="330" y="52" text-anchor="middle" font-family="monospace" font-size="9" fill="#7F77DD">MEMORY STORE</text>
  <circle cx="308" cy="74" r="3" fill="#534AB7" class="md1"/>
  <circle cx="322" cy="66" r="3" fill="#534AB7" class="md2"/>
  <circle cx="336" cy="80" r="3" fill="#534AB7" class="md3"/>
  <circle cx="350" cy="64" r="3" fill="#534AB7" class="md4"/>
  <circle cx="315" cy="90" r="3" fill="#534AB7" class="md5"/>
  <circle cx="344" cy="92" r="3" fill="#7F77DD" class="md1"/>
  <circle cx="326" cy="100" r="3" fill="#7F77DD" class="md3"/>
  <line x1="308" y1="74" x2="322" y2="66" stroke="#534AB7" stroke-width="0.5" opacity="0.5"/>
  <line x1="322" y1="66" x2="336" y2="80" stroke="#534AB7" stroke-width="0.5" opacity="0.5"/>
  <line x1="336" y1="80" x2="350" y2="64" stroke="#534AB7" stroke-width="0.5" opacity="0.5"/>
  <line x1="315" y1="90" x2="336" y2="80" stroke="#534AB7" stroke-width="0.5" opacity="0.5"/>
  <line x1="344" y1="92" x2="336" y2="80" stroke="#7F77DD" stroke-width="0.5" opacity="0.5"/>
  <line x1="326" y1="100" x2="315" y2="90" stroke="#7F77DD" stroke-width="0.5" opacity="0.5"/>
  <text x="330" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#534AB7">ChromaDB · BGE</text>
</g>

<line x1="382" y1="86" x2="422" y2="86" stroke="#7F77DD" stroke-width="1" marker-end="url(#arr)" class="flow3 si4"/>

<g class="si4">
  <rect x="424" y="46" width="86" height="80" rx="6" fill="#110e00" stroke="#EF9F27" stroke-width="1"/>
  <text x="467" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="#EF9F27">RETRIEVAL</text>
  <text x="467" y="78" text-anchor="middle" font-family="monospace" font-size="8" fill="#BA7517">VideoTree</text>
  <rect x="436" y="86" width="62" height="6" rx="2" fill="#1a1206" stroke="#EF9F27" stroke-width="0.5"/>
  <rect x="436" y="86" width="46" height="6" rx="2" fill="#EF9F27" class="p3"/>
  <rect x="436" y="96" width="62" height="6" rx="2" fill="#1a1206" stroke="#EF9F27" stroke-width="0.5"/>
  <rect x="436" y="96" width="30" height="6" rx="2" fill="#BA7517" class="p4"/>
  <rect x="436" y="106" width="62" height="6" rx="2" fill="#1a1206" stroke="#EF9F27" stroke-width="0.5"/>
  <rect x="436" y="106" width="50" height="6" rx="2" fill="#854F0B" class="p2"/>
  <text x="467" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#854F0B">evidence rank</text>
</g>

<line x1="510" y1="86" x2="550" y2="86" stroke="#EF9F27" stroke-width="1" marker-end="url(#arr)" class="flow4 si5"/>

<g class="si5">
  <rect x="552" y="46" width="100" height="80" rx="6" fill="#031a11" stroke="#5DCAA5" stroke-width="1"/>
  <text x="602" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="#5DCAA5">LLM ANSWER</text>
  <text x="602" y="78" text-anchor="middle" font-family="monospace" font-size="8" fill="#1D9E75">Qwen2.5-7B</text>
  <rect x="564" y="86" width="76" height="7" rx="2" fill="#04342C" stroke="#1d9e75" stroke-width="0.5"/>
  <rect x="564" y="97" width="50" height="7" rx="2" fill="#04342C" stroke="#1d9e75" stroke-width="0.5"/>
  <rect x="564" y="108" width="64" height="7" rx="2" fill="#085041" stroke="#1d9e75" stroke-width="0.5"/>
  <circle cx="614" cy="104" r="4" fill="#1d9e75" class="p1"/>
  <text x="602" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="#0f6e56">multi-choice QA</text>
</g>

<text x="69" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#0f6e56">input</text>
<text x="193" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#185FA5">encode</text>
<text x="330" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#534AB7">index</text>
<text x="467" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#854F0B">rank</text>
<text x="602" y="158" text-anchor="middle" font-family="monospace" font-size="8" fill="#0f6e56">reason</text>

<text x="340" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#2C2C2A" letter-spacing="1">· temporal gap analysis · abstention-aware eval · JAKE / TASHA benchmarks ·</text>
</svg>
